name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read crate version
        id: ver
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build the dev image
        run: make image

      - name: Build packages (tar.gz, deb, rpm for x86_64 and aarch64)
        run: make package

      - name: Install the packages in clean distro containers
        run: make package-check

      - uses: actions/upload-artifact@v4
        with:
          name: snapforge-${{ steps.ver.outputs.version }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
            scripts/get.sh

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Prefer "## <version>" (optionally "v" prefixed), fall back to "## Unreleased".
          for h in "$VERSION" "v$VERSION" "Unreleased"; do
            awk -v h="## $h" '
              $0 == h || index($0, h " ") == 1 { on = 1; next }
              /^## / { on = 0 }
              on' CHANGELOG.md > notes.md
            [ -s notes.md ] && break
          done
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/SHA256SUMS scripts/get.sh

[workspace]
resolver = "2"
members = [
    "crates/guide-core",
    "crates/guide-capture",
    "crates/guide-export",
    "crates/guide-hotkeys",
    "crates/guide-render",
    "crates/guide-storage",
    "crates/guide-app",
]

[workspace.package]
version = "0.1.0-alpha1"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
